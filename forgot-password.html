<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ||Link to Stylesheet -->
    <link rel="stylesheet" href="./forgot-password.css">

    <!-- Link to JS Script -->
    <script defer src="./forgot-password.js"></script>

    <!-- Google icons links -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />

    <title>Forgot Password</title>
</head>
<body>
    <div class="container">
        <div class="top">
            <h1>Forgot Password?</h1>
        </div>

        <form action="" class="form">
            <a href="./index.html" class="login-link"></a>
            <div class="input-box">
                <input type="text" placeholder="Username" class="usename">
                <span class="material-symbols-rounded icon">account_circle</span>
                <div class="error">Please Enter your username</div>
            </div>

            <div class="input-box">
                <input type="password" placeholder="New Password" class="new-password">
                <span class="material-symbols-rounded icon">lock</span>
                <div class="error"></div>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Confirm Password" class="confirm-password">
                <span class="material-symbols-rounded icon">lock</span>
                <div class="error"></div>
            </div>

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</body>
</html>
